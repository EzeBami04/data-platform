#===== Deploy to VM =========
name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/airflow-dbt-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/airflow-dbt-app:${{ github.sha }}
          no-cache: true

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Copy Compose file to VM
        run: |
          gcloud compute scp \
            infrastructure/docker/compose.yml \
            "analystbami30@${{ secrets.GCP_VM_NAME }}:/home/analystbami30/airflow/compose.yml" \
            --zone="${{ secrets.GCP_ZONE }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}"

      - name: Copy deploy script to VM
        run: |
          gcloud compute scp \
            infrastructure/scripts/docker/deploy.sh \
            "analystbami30@${{ secrets.GCP_VM_NAME }}:/home/analystbami30/airflow/deploy.sh" \
            --zone="${{ secrets.GCP_ZONE }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}"

      - name: Deploy to VM
        run: |
          gcloud compute ssh "analystbami30@${{ secrets.GCP_VM_NAME }}" \
            --zone="${{ secrets.GCP_ZONE }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --command="chmod +x /home/analystbami30/airflow/deploy.sh && bash /home/analystbami30/airflow/deploy.sh"