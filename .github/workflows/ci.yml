# .github/workflows/ci.yml
# Builds the Airflow image and validates that every DAG imports cleanly.
# Runs on every push/PR to main; deploy.yml handles actually shipping it.
# 17/8 deleted Old docekr image

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Airflow image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          push: false
          tags: airflow-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Write DAG validation script
        run: |
          mkdir -p ci
          cat > ci/validate_dags.py <<'EOF'
          import sys
          from airflow.models import DagBag

          db = DagBag(dag_folder='/opt/airflow/dags', include_examples=False)
          if db.import_errors:
              for f, e in db.import_errors.items():
                  print(f'{f}: {e}')
              sys.exit(1)
          print(f'{len(db.dags)} DAG(s) imported successfully')
          EOF

      - name: Validate DAGs import without errors
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/airflow/dags:/opt/airflow/dags \
            -v ${{ github.workspace }}/python:/opt/airflow/python \
            -v ${{ github.workspace }}/ci:/opt/ci \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=False \
            -e AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////tmp/ci_airflow.db \
            airflow-app:ci \
            bash -c "airflow db migrate && python /opt/ci/validate_dags.py"

